<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebrew Quiz</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            padding: 24px;
        }

        .page {
            background: white;
            width: 100%;
            max-width: 900px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .letter-box {
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 56px;
            font-weight: bold;
            background: #eef2ff;
            border-radius: 10px;
            color: #1d4ed8;
        }

        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        .status {
            font-weight: 600;
            min-height: 20px;
        }

        .correct {
            color: #15803d;
        }

        .incorrect {
            color: #b91c1c;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .hidden {
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 760px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <a class="back-link" href="index.html">← Back</a>
        <h1>Hebrew Letters Quiz</h1>
        <div id="quizContainer" class="grid"></div>

        <div class="actions">
            <button id="submitBtn" type="button">Submit</button>
            <button id="newQuizBtn" class="hidden" type="button">New quiz</button>
        </div>
    </div>

    <script>
        const letters = [
            { symbol: 'א', name: 'Alef' },
            { symbol: 'בּ', name: 'Bet' },
            { symbol: 'ב', name: 'Vet' },
            { symbol: 'ג', name: 'Gimel' },
            { symbol: 'ד', name: 'Dalet' },
            { symbol: 'ה', name: 'Hei' },
            { symbol: 'ו', name: 'Vav' },
            { symbol: 'ז', name: 'Zayin' },
            { symbol: 'ח', name: 'Het' },
            { symbol: 'ט', name: 'Tet' },
            { symbol: 'י', name: 'Yod' },
            { symbol: 'כּ', name: 'Kaf' },
            { symbol: 'כ', name: 'Chaf' },
            { symbol: 'ל', name: 'Lamed' },
            { symbol: 'מ', name: 'Mem' },
            { symbol: 'נ', name: 'Nun' },
            { symbol: 'ס', name: 'Samech' },
            { symbol: 'ע', name: 'Ayin' },
            { symbol: 'פּ', name: 'Pe' },
            { symbol: 'פ', name: 'Fe' },
            { symbol: 'צ', name: 'Tsadi' },
            { symbol: 'ק', name: 'Qof' },
            { symbol: 'ר', name: 'Resh' },
            { symbol: 'ש', name: 'Shin/Sin' },
            { symbol: 'ת', name: 'Tav' }
        ];

        const quizContainer = document.getElementById('quizContainer');
        const submitBtn = document.getElementById('submitBtn');
        const newQuizBtn = document.getElementById('newQuizBtn');
        let currentQuestions = [];

        function shuffle(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function makeQuestion() {
            const correct = letters[Math.floor(Math.random() * letters.length)];
            const distractors = shuffle(letters.filter(item => item.name !== correct.name)).slice(0, 3);
            const options = shuffle([correct, ...distractors]);
            return {
                ...correct,
                options: options.map(item => item.name)
            };
        }

        function renderQuiz() {
            currentQuestions = Array.from({ length: 4 }, makeQuestion);
            quizContainer.innerHTML = '';

            currentQuestions.forEach((question) => {
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <div class="letter-box">${question.symbol}</div>
                    <select>
                        <option value="">Choose the letter name</option>
                        ${question.options.map(option => `<option value="${option}">${option}</option>`).join('')}
                    </select>
                    <div class="status"></div>
                `;

                quizContainer.appendChild(card);
            });

            submitBtn.classList.remove('hidden');
            newQuizBtn.classList.add('hidden');
        }

        submitBtn.addEventListener('click', () => {
            const cards = quizContainer.querySelectorAll('.card');

            cards.forEach((card, index) => {
                const select = card.querySelector('select');
                const status = card.querySelector('.status');
                const selectedValue = select.value;
                const correctAnswer = currentQuestions[index].name;

                if (!selectedValue) {
                    status.textContent = 'Please choose an option.';
                    status.className = 'status incorrect';
                } else if (selectedValue === correctAnswer) {
                    status.textContent = 'Correct!';
                    status.className = 'status correct';
                } else {
                    status.textContent = `Not correct. The correct answer is ${correctAnswer}.`;
                    status.className = 'status incorrect';
                }
            });

            submitBtn.classList.add('hidden');
            newQuizBtn.classList.remove('hidden');
        });

        newQuizBtn.addEventListener('click', renderQuiz);

        renderQuiz();
    </script>
</body>
</html>
