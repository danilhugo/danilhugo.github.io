<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Python Browser App</title>
    <!-- CSS styles for basic presentation -->
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #0056b3; }
        #quote { font-style: italic; font-size: 18px; color: #333; min-height: 50px; }
    </style>
    <!-- Link PyScript assets so Python can execute in the browser -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
</head>
<body>

    <div class="card">
        <h2>Python Quote Generator</h2>
        <p id="quote">Loading Python environment...</p>
        <button id="btn" py-click="generate_quote">New Quote</button>
    </div>

    <!-- Your actual Python logic goes inside this tag -->
    <script type="py">
        import random
        from pyscript import document

        quotes = [
            "The only way to do great work is to love what you do. - Steve Jobs",
            "Progress, not perfection. - Unknown",
            "Python is execution executable pseudocode. - Bruce Eckel",
            "Simplicity is better than complex. - The Zen of Python",
            "Code is like humor. When you have to explain it, it’s bad. - Cory House"
        ]

        def generate_quote(event):
            # Select a random quote and update the HTML paragraph tag
            selected = random.choice(quotes)
            document.querySelector("#quote").innerText = selected

        # Run once on initial page load
        generate_quote(None)
    </script>

</body>
</html>
