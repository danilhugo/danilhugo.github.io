<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes Dashboard</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #333333;
            --primary: #4a90e2;
            --danger: #e74c3c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            text-align: center;
            color: #2c3e50;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.9;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f9f9f9;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid var(--primary);
            animation: fadeIn 0.3s ease;
        }
        .delete-btn {
            background-color: var(--danger);
            padding: 6px 12px;
            font-size: 14px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 QuickNotes</h1>
    <div class="input-group">
        <input type="text" id="noteInput" placeholder="Write a note or task...">
        <button onclick="addNote()">Add</button>
    </div>
    <ul id="notesList"></ul>
</div>

<script>
    // Load existing items on startup
    document.addEventListener("DOMContentLoaded", loadNotes);

    const noteInput = document.getElementById("noteInput");
    const notesList = document.getElementById("notesList");

    // Add note on Enter press
    noteInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter") addNote();
    });

    function addNote() {
        const text = noteInput.value.trim();
        if (!text) return;

        const notes = getLocalStorage();
        notes.push(text);
        localStorage.setItem("notes", JSON.stringify(notes));

        renderNoteElement(text);
        noteInput.value = "";
    }

    function deleteNote(element, text) {
        let notes = getLocalStorage();
        notes = notes.filter(note => note !== text);
        localStorage.setItem("notes", JSON.stringify(notes));
        element.parentElement.remove();
    }

    function loadNotes() {
        const notes = getLocalStorage();
        notes.forEach(note => renderNoteElement(note));
    }

    function renderNoteElement(text) {
        const li = document.createElement("li");
        li.innerHTML = `
            <span>${escapeHTML(text)}</span>
            <button class="delete-btn" onclick="deleteNote(this, '${text.replace(/'/g, "\\'")}')">✕</button>
        `;
        notesList.appendChild(li);
    }

    function getLocalStorage() {
        return JSON.parse(localStorage.getItem("notes")) || [];
    }

    function escapeHTML(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
